<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>银行设备运维管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background: #f5f7fa; }
        .sidebar { min-height: 100vh; background: #2c3e50; color: white; }
        .sidebar a { color: #ecf0f1; text-decoration: none; padding: 12px 20px; display: block; }
        .sidebar a:hover, .sidebar a.active { background: #34495e; }
        .stat-card { border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        .stat-card h3 { font-size: 2rem; margin: 0; }
        .table-responsive { background: white; border-radius: 10px; padding: 20px; }
        .badge-响应中 { background: #74b9ff; color: #0984e3; }
        .badge-审批中 { background: #a29bfe; color: #6c5ce7; }
        .badge-已完成 { background: #55efc4; color: #00b894; }
        .overdue { color: #d63031; font-weight: bold; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar p-0">
            <div class="p-3 text-center border-bottom"><h5><i class="bi bi-bank"></i> 运维管理</h5></div>
            <a href="#" onclick="showPage('generate')" class="active" id="nav-generate"><i class="bi bi-magic"></i> 工单生成</a>
            <a href="#" onclick="showPage('workorders')" id="nav-workorders"><i class="bi bi-file-earmark-text"></i> 工单管理</a>
            <a href="#" onclick="showPage('dashboard')" id="nav-dashboard"><i class="bi bi-speedometer2"></i> 数据看板</a>
            <a href="#" onclick="showPage('vendors')" id="nav-vendors"><i class="bi bi-people"></i> 运维商</a>
        </div>
        
        <div class="col-md-10 p-4">
            <!-- 工单生成 -->
            <div id="page-generate">
                <h4 class="mb-4"><i class="bi bi-magic"></i> 工单生成</h4>
                <div class="card mb-4">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0"><i class="bi bi-chat-dots"></i> 粘贴工单信息</h5>
                    </div>
                    <div class="card-body">
                        <p class="text-muted">请粘贴微信收到的工单信息，AI将自动分析并匹配运维商</p>
                        <div class="mb-3">
                            <textarea class="form-control" id="ai-input" rows="8" placeholder="例如：报修部门：武鸣狮山路小微支行 地址：南宁市武鸣区狮山路6号桂林银行 报修人及联系电话：石倩华19977134384 具体报修项目：门头Led部分灯不亮。"></textarea>
                        </div>
                        <button class="btn btn-primary btn-lg" onclick="analyzeWorkorder()"><i class="bi bi-cpu"></i> AI智能分析</button>
                    </div>
                </div>
                
                <div class="card" id="analysis-result" style="display:none;">
                    <div class="card-header bg-warning">
                        <h5 class="mb-0"><i class="bi bi-pencil"></i> 分析结果 - 请核对后确认</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">机构/网点</label>
                                <input type="text" class="form-control" id="edit-dept">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">地址</label>
                                <input type="text" class="form-control" id="edit-address">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">报修人</label>
                                <input type="text" class="form-control" id="edit-person">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">联系电话</label>
                                <input type="text" class="form-control" id="edit-phone">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">设备类型</label>
                                <select class="form-select" id="edit-device">
                                    <option value="存取款一体机/ATM">存取款一体机/ATM</option>
                                    <option value="高速大额存取款机">高速大额存取款机</option>
                                    <option value="回单机/自助终端">回单机/自助终端</option>
                                    <option value="综合版智能柜台">综合版智能柜台</option>
                                    <option value="标准版智能柜台">标准版智能柜台</option>
                                    <option value="网银一体机/LED走字屏">网银一体机/LED走字屏</option>
                                    <option value="空调维护">空调维护</option>
                                    <option value="零星维修">零星维修</option>
                                    <option value="叫号机/宣传屏">叫号机/宣传屏</option>
                                    <option value="征信查询机">征信查询机</option>
                                    <option value="移动营销/底座/GPS">移动营销/底座/GPS</option>
                                    <option value="其他">其他</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">运维商</label>
                                <select class="form-select" id="edit-vendor"></select>
                            </div>
                            <div class="col-md-12 mb-3">
                                <label class="form-label">故障描述</label>
                                <input type="text" class="form-control" id="edit-desc">
                            </div>
                        </div>
                        <button class="btn btn-success btn-lg" onclick="confirmCreate()"><i class="bi bi-check-circle"></i> 确认生成工单</button>
                    </div>
                </div>
                
                <div class="card" id="success-result" style="display:none;">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0"><i class="bi bi-check-circle"></i> 工单创建成功</h5>
                    </div>
                    <div class="card-body" id="success-content"></div>
                </div>
            </div>
            
            <!-- 工单管理 -->
            <div id="page-workorders">
                <h4 class="mb-4"><i class="bi bi-file-earmark-text"></i> 工单管理</h4>
                
                <div class="card mb-3">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-3">
                                <input type="text" class="form-control" id="search-order" placeholder="机构名称模糊查询..." onkeyup="renderWorkorders()">
                            </div>
                            <div class="col-md-3">
                                <input type="date" class="form-control" id="search-date-start" onchange="renderWorkorders()">
                            </div>
                            <div class="col-md-3">
                                <input type="date" class="form-control" id="search-date-end" onchange="renderWorkorders()">
                            </div>
                            <div class="col-md-3">
                                <button class="btn btn-success w-100" onclick="exportExcel()"><i class="bi bi-download"></i> 导出Excel</button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="d-flex gap-2 mb-3">
                    <button class="btn btn-outline-secondary" onclick="filterStatus('all')">全部</button>
                    <button class="btn btn-outline-info" onclick="filterStatus('响应中')">响应中</button>
                    <button class="btn btn-outline-purple" onclick="filterStatus('审批中')">审批中</button>
                    <button class="btn btn-outline-success" onclick="filterStatus('已完成')">已完成</button>
                </div>
                
                <div class="table-responsive">
                    <table class="table table-hover" id="workorder-table">
                        <thead class="table-light">
                            <tr><th>工单号</th><th>机构/网点</th><th>设备类型</th><th>故障描述</th><th>状态</th><th>运维商</th><th>创建时间</th></tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
            
            <!-- 数据看板 -->
            <div id="page-dashboard">
                <h4 class="mb-4"><i class="bi bi-speedometer2"></i> 数据看板</h4>
                
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="row text-center">
                            <div class="col-md-2"><div class="text-muted">本月工单</div><h3 id="month-total">0</h3></div>
                            <div class="col-md-2"><div class="text-muted">本月已完成</div><h3 class="text-success" id="month-done">0</h3></div>
                            <div class="col-md-2"><div class="text-muted" style="cursor:pointer" onclick="showPendingDetail('month')">本月未完成</div><h3 class="text-warning" id="month-pending">0</h3></div>
                            <div class="col-md-2"><div class="text-muted">本周工单</div><h3 id="week-total">0</h3></div>
                            <div class="col-md-2"><div class="text-muted">本周已完成</div><h3 class="text-success" id="week-done">0</h3></div>
                            <div class="col-md-2"><div class="text-muted">平均响应时长</div><h3 id="avg-response">0h</h3></div>
                        </div>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6">
                        <div class="table-responsive">
                            <h5>供应商工单分布</h5>
                            <canvas id="chart-vendor" height="200"></canvas>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="table-responsive">
                            <h5>各供应商响应时长对比</h5>
                            <canvas id="chart-response" height="200"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 运维商 -->
            <div id="page-vendors" style="display:none;">
                <h4 class="mb-4"><i class="bi bi-people"></i> 运维商信息</h4>
                <div class="table-responsive">
                    <table class="table table-hover" id="vendor-table">
                        <thead><tr><th>设备类型</th><th>品牌</th><th>运维商</th><th>联系人</th><th>电话</th><th>备注</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
<script>
// 完整运维商数据（从Excel提取）
const vendors = [
    // 存取款一体机/ATM - 中电
    {type:'存取款一体机/ATM', brand:'中电', vendor:'广东奔腾达电子有限公司', contact:'周洪啸', phone:'18176252256', note:'桂银安保APP报修'},
    {type:'存取款一体机/ATM', brand:'日立', vendor:'江苏国光信息产业股份有限公司', contact:'苏乃锋', phone:'19977164610'},
    {type:'存取款一体机/ATM', brand:'OKI', vendor:'广东奔腾达电子有限公司', contact:'韩东', phone:'18178601382'},
    // 高速大额存取款机
    {type:'高速大额存取款机', brand:'长城', vendor:'广东奔腾达电子有限公司', contact:'韩东', phone:'18178601382'},
    {type:'高速大额存取款机', brand:'中电', vendor:'广西建投桂银科技有限公司', contact:'郭亮', phone:'13977160058'},
    // 回单机/自助终端
    {type:'回单机/自助终端', brand:'南天', vendor:'广州南天电脑系统有限公司', contact:'梁太钦', phone:'13877130518'},
    // 综合版智能柜台
    {type:'综合版智能柜台', brand:'中软', vendor:'广西佰鼎科技有限公司', contact:'莫德文', phone:'18278387986'},
    {type:'综合版智能柜台', brand:'长城', vendor:'广东奔腾达电子有限公司', contact:'肖俊宏', phone:'13878748626'},
    // 标准版智能柜台
    {type:'标准版智能柜台', brand:'长城', vendor:'广东奔腾达电子有限公司', contact:'肖俊宏', phone:'13878748626'},
    // 网银一体机/LED走字屏
    {type:'网银一体机/LED走字屏', brand:'联想', vendor:'广西佳仕运网络科技有限公司', contact:'陈剑云', phone:'13977300180', note:'分行后勤维修群报修'},
    // 空调维护
    {type:'空调维护', brand:'/', vendor:'广西南宁市源申隆贸易有限公司', contact:'陈国斌', phone:'19077164249'},
    // 零星维修
    {type:'零星维修', brand:'/', vendor:'广西三弦建设工程有限公司', contact:'曾海龙', phone:'13407718924'},
    // 叫号机/宣传屏
    {type:'叫号机/宣传屏', brand:'/', vendor:'桂林宇峰电子科技有限公司', contact:'唐孝纯', phone:'18178357885'},
    // 征信查询机
    {type:'征信查询机', brand:'/', vendor:'北京信立合创信息技术有限公司', contact:'谭因金', phone:'13878372640'},
    // 移动营销/底座/GPS
    {type:'移动营销/底座/GPS', brand:'联想/华为/至高/信雅达', vendor:'业务问题请在企业微信群反馈，设备故障请在分行后勤维修群报修', contact:'', phone:''},
    // 其他
    {type:'其他', brand:'', vendor:'待分配', contact:'', phone:''},
];

let workorders = JSON.parse(localStorage.getItem('workorders') || '[]');
let currentFilter = 'all';
let analyzedData = null;

function saveWorkorders() {
    localStorage.setItem('workorders', JSON.stringify(workorders));
    renderWorkorders();
    renderDashboard();
}

function getVendorByDevice(device) {
    const v = vendors.find(x => device.includes(x.type.split('/')[0]) || x.type.includes(device));
    return v ? v : null;
}

function getVendorList(device) {
    return vendors.filter(x => device.includes(x.type.split('/')[0]) || x.type.includes(device) || x.type === '其他');
}

function generateOrderNo() {
    const now = new Date();
    return 'WO' + now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0') + String(workorders.length+1).padStart(4,'0');
}

function analyzeWorkorder() {
    const input = document.getElementById('ai-input').value;
    if(!input.trim()){alert('请输入工单信息');return;}
    
    let dept='', address='', person='', phone='', device='其他', desc='';
    let matchedVendor = null;
    
    const deptMatch = input.match(/报修部门[：:]\s*(.+?)(?:\n|$)/);
    if(deptMatch) dept = deptMatch[1].trim();
    
    const addrMatch = input.match(/地址[：:]\s*(.+?)(?:\n|$)/);
    if(addrMatch) address = addrMatch[1].trim();
    
    const personPhoneMatch = input.match(/报修人[及和]*联系电话*[：:]\s*(.+?)(?:\n|$)/);
    if(personPhoneMatch) {
        const pp = personPhoneMatch[1].trim();
        const phoneMatch = pp.match(/(\d{11})/);
        if(phoneMatch) {phone = phoneMatch[1]; person = pp.replace(phone,'').replace(/[，。,]/g,'').trim();}
        else person = pp;
    } else {
        const pMatch = input.match(/报修人[：:]\s*(.+?)(?:,|，|联系电话|$)/);
        if(pMatch) person = pMatch[1].trim();
        const phMatch = input.match(/联系电话[：:]\s*(\d{11})/);
        if(phMatch) phone = phMatch[1];
    }
    if(!phone) {const m=input.match(/(\d{11})/); if(m) phone=m[1];}
    
    const descMatch = input.match(/具体报修项目[：:]\s*(.+?)(?:\n|$)/);
    if(descMatch) desc = descMatch[1].trim();
    else {const d2=input.match(/故障[：:]\s*(.+?)(?:\n|$)/);if(d2) desc=d2[1].trim();}
    
    const lower = input.toLowerCase();
    if(lower.includes('atm')||lower.includes('取款机')) device='存取款一体机/ATM';
    else if(lower.includes('高速')||lower.includes('大额')) device='高速大额存取款机';
    else if(lower.includes('回单')||lower.includes('自助终端')) device='回单机/自助终端';
    else if(lower.includes('综合版')||lower.includes('综合智能柜台')) device='综合版智能柜台';
    else if(lower.includes('标准版')||lower.includes('智能柜台')) device='标准版智能柜台';
    else if(lower.includes('led')||lower.includes('显示屏')||lower.includes('灯箱')||lower.includes('网银一体机')) device='网银一体机/LED走字屏';
    else if(lower.includes('空调')) device='空调维护';
    else if(lower.includes('叫号')||lower.includes('宣传屏')) device='叫号机/宣传屏';
    else if(lower.includes('征信')||lower.includes('查询机')) device='征信查询机';
    else if(lower.includes('移动营销')||lower.includes('底座')||lower.includes('gps')) device='移动营销/底座/GPS';
    else if(lower.includes('零星')||lower.includes('维修')) device='零星维修';
    
    matchedVendor = getVendorByDevice(device);
    if(!address && dept) address = dept;
    
    analyzedData = {dept, address, person, phone, device, desc, vendor: matchedVendor};
    
    document.getElementById('edit-dept').value = dept || '';
    document.getElementById('edit-address').value = address || '';
    document.getElementById('edit-person').value = person || '';
    document.getElementById('edit-phone').value = phone || '';
    document.getElementById('edit-device').value = device;
    document.getElementById('edit-desc').value = desc || '';
    
    const sel = document.getElementById('edit-vendor');
    const vendorList = getVendorList(device);
    sel.innerHTML = vendorList.map(v => '<option value="'+v.vendor+'" '+(v.vendor === (matchedVendor?matchedVendor.vendor:'') ?'selected':'')+'>'+v.vendor+' ('+v.type+') - '+v.contact+' '+v.phone+'</option>').join('');
    
    document.getElementById('analysis-result').style.display = 'block';
    document.getElementById('success-result').style.display = 'none';
}

function confirmCreate() {
    if(!analyzedData) return;
    
    const order = {
        id: generateOrderNo(),
        dept: document.getElementById('edit-dept').value,
        address: document.getElementById('edit-address').value,
        person: document.getElementById('edit-person').value,
        phone: document.getElementById('edit-phone').value,
        device: document.getElementById('edit-device').value,
        desc: document.getElementById('edit-desc').value,
        vendor: document.getElementById('edit-vendor').value,
        status: '响应中',
        createTime: new Date().toISOString(),
        assignTime: new Date().toISOString(),
        completeTime: null
    };
    
    workorders.unshift(order);
    saveWorkorders();
    
    document.getElementById('analysis-result').style.display = 'none';
    document.getElementById('ai-input').value = '';
    
    document.getElementById('success-content').innerHTML = '<h4>工单号：'+order.id+'</h4><p>机构：'+order.dept+'</p><p>设备：'+order.device+'</p><p>运维商：'+order.vendor+'</p><p>状态：<span class="badge badge-响应中">响应中</span></p>';
    document.getElementById('success-result').style.display = 'block';
    analyzedData = null;
}

function renderWorkorders(){
    const now = new Date();
    const weekAgo = new Date(now.getTime() - 7*86400000);
    const search = document.getElementById('search-order').value.toLowerCase();
    const dateStart = document.getElementById('search-date-start').value;
    const dateEnd = document.getElementById('search-date-end').value;
    
    let f = workorders.filter(o => {
        if(o.status === '已完成' && o.completeTime) {
            const completeDate = new Date(o.completeTime);
            if(now - completeDate > 7*86400000) return false;
        }
        if(currentFilter !== 'all' && o.status !== currentFilter) return false;
        if(search && !(o.dept||'').toLowerCase().includes(search) && !(o.vendor||'').toLowerCase().includes(search)) return false;
        if(dateStart || dateEnd) {
            const ctime = new Date(o.createTime).toISOString().split('T')[0];
            if(dateStart && ctime < dateStart) return false;
            if(dateEnd && ctime > dateEnd) return false;
        }
        return true;
    });
    
    // 按时间晚-早排序（最新在前）
    f.sort((a,b) => new Date(b.createTime) - new Date(a.createTime));
    
    const oneWeekAgo = new Date(now.getTime() - 7*86400000);
    
    document.querySelector('#workorder-table tbody').innerHTML = f.map(o => {
        const isOverdue = o.status !== '已完成' && new Date(o.createTime) < oneWeekAgo;
        const rowClass = isOverdue ? 'overdue' : '';
        return '<tr class="'+rowClass+'"><td>'+o.id+'</td><td>'+o.dept+'</td><td>'+o.device+'</td><td>'+(o.desc||'-').substring(0,15)+'</td><td><select class="form-select form-select-sm" style="width:auto;display:inline-block" onchange="changeStatus(\''+o.id+'\',this.value)"><option '+(o.status==='响应中'?'selected':'')+'>响应中</option><option '+(o.status==='审批中'?'selected':'')+'>审批中</option><option '+(o.status==='已完成'?'selected':'')+'>已完成</option></select></td><td>'+(o.vendor||'-')+'</td><td>'+new Date(o.createTime).toLocaleString()+'</td></tr>';
    }).join('');
}

function filterStatus(s){
    currentFilter = s;
    renderWorkorders();
}

function changeStatus(id, newStatus) {
    const o = workorders.find(x => x.id === id);
    if(!o) return;
    o.status = newStatus;
    if(newStatus === '已完成') o.completeTime = new Date().toISOString();
    else o.completeTime = null;
    saveWorkorders();
}

function showPendingDetail(type) {
    const now = new Date();
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    const weekAgo = new Date(now.getTime() - 7*86400000);
    
    let orders = type === 'month' 
        ? workorders.filter(o => new Date(o.createTime) >= monthStart && o.status !== '已完成')
        : workorders.filter(o => new Date(o.createTime) >= weekAgo && o.status !== '已完成');
    
    alert((type==='month'?'本月':'本周')+'未完成工单：\n\n' + orders.map(o=>o.id+' '+o.dept+' '+o.device).join('\n'));
}

function renderDashboard(){
    const now = new Date();
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    const weekAgo = new Date(now.getTime() - 7*86400000);
    
    const monthOrders = workorders.filter(o => new Date(o.createTime) >= monthStart);
    const monthDone = monthOrders.filter(o => o.status === '已完成').length;
    const monthPending = monthOrders.filter(o => o.status !== '已完成').length;
    
    const weekOrders = workorders.filter(o => new Date(o.createTime) >= weekAgo);
    const weekDone = weekOrders.filter(o => o.status === '已完成').length;
    
    let avgHours = '0h';
    const doneOrders = workorders.filter(o => o.status === '已完成' && o.assignTime);
    if(doneOrders.length > 0) {
        const total = doneOrders.reduce((s,o) => s + (new Date(o.assignTime) - new Date(o.createTime))/36e5, 0);
        avgHours = (total / doneOrders.length).toFixed(1) + 'h';
    }
    
    document.getElementById('month-total').textContent = monthOrders.length;
    document.getElementById('month-done').textContent = monthDone;
    document.getElementById('month-pending').textContent = monthPending;
    document.getElementById('week-total').textContent = weekOrders.length;
    document.getElementById('week-done').textContent = weekDone;
    document.getElementById('avg-response').textContent = avgHours;
    
    const vendorCount = {};
    monthOrders.forEach(o => { vendorCount[o.vendor] = (vendorCount[o.vendor]||0)+1 });
    
    const ctxV = document.getElementById('chart-vendor');
    if(ctxV.chart) ctxV.chart.destroy();
    ctxV.chart = new Chart(ctxV, {
        type: 'bar',
        data: {labels: Object.keys(vendorCount), datasets: [{label:'工单数', data: Object.values(vendorCount), backgroundColor:'#36a2eb'}]},
        options: {indexAxis: 'y'}
    });
    
    const vendorTime = {};
    doneOrders.forEach(o => {
        if(o.assignTime) {
            const hours = (new Date(o.assignTime) - new Date(o.createTime))/36e5;
            if(!vendorTime[o.vendor]) vendorTime[o.vendor] = [];
            vendorTime[o.vendor].push(hours);
        }
    });
    const avgTimes = {};
    Object.keys(vendorTime).forEach(v => {
        avgTimes[v] = vendorTime[v].reduce((a,b)=>a+b,0) / vendorTime[v].length;
    });
    
    const ctxR = document.getElementById('chart-response');
    if(ctxR.chart) ctxR.chart.destroy();
    ctxR.chart = new Chart(ctxR, {
        type: 'bar',
        data: {labels: Object.keys(avgTimes), datasets: [{label:'平均响应时长(h)', data: Object.values(avgTimes), backgroundColor:'#ff6384'}]},
        options: {indexAxis: 'y'}
    });
}

function renderVendors(){
    document.querySelector('#vendor-table tbody').innerHTML = vendors.map(v=>'<tr><td>'+v.type+'</td><td>'+(v.brand||'-')+'</td><td>'+v.vendor+'</td><td>'+(v.contact||'-')+'</td><td>'+(v.phone||'-')+'</td><td>'+(v.note||'-')+'</td></tr>').join('');
}

function exportExcel(){
    const ws = XLSX.utils.json_to_sheet(workorders.map(o=>({工单号:o.id,机构:o.dept,地址:o.address,报修人:o.person,电话:o.phone,设备:o.device,故障:o.desc,状态:o.status,运维商:o.vendor,创建时间:o.createTime,完成时间:o.completeTime})));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'工单');
    XLSX.writeFile(wb,'工单明细.xlsx');
}

function showPage(page){
    document.querySelectorAll('[id^="page-"]').forEach(p=>p.style.display='none');
    document.getElementById('page-'+page).style.display='block';
    document.querySelectorAll('.sidebar a').forEach(a=>a.classList.remove('active'));
    document.getElementById('nav-'+page).classList.add('active');
    if(page==='workorders')renderWorkorders();
    if(page==='dashboard')renderDashboard();
    if(page==='vendors')renderVendors();
}

renderWorkorders();renderDashboard();renderVendors();
</script>
</body>
</html>
