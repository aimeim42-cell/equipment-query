<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>银行设备运维管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background: #f5f7fa; }
        .sidebar { min-height: 100vh; background: #2c3e50; color: white; }
        .sidebar a { color: #ecf0f1; text-decoration: none; padding: 12px 20px; display: block; }
        .sidebar a:hover, .sidebar a.active { background: #34495e; }
        .stat-card { border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        .stat-card h3 { font-size: 2rem; margin: 0; }
        .table-responsive { background: white; border-radius: 10px; padding: 20px; }
        .badge-待分配 { background: #ffeaa7; color: #d63031; }
        .badge-已分配 { background: #74b9ff; color: #0984e3; }
        .badge-处理中 { background: #a29bfe; color: #6c5ce7; }
        .badge-已完成 { background: #55efc4; color: #00b894; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar p-0">
            <div class="p-3 text-center border-bottom"><h5><i class="bi bi-bank"></i> 运维管理</h5></div>
            <a href="#" onclick="showPage('dashboard')" class="active" id="nav-dashboard"><i class="bi bi-speedometer2"></i> 数据看板</a>
            <a href="#" onclick="showPage('workorders')" id="nav-workorders"><i class="bi bi-file-earmark-text"></i> 工单管理</a>
            <a href="#" onclick="showPage('create')" id="nav-create"><i class="bi bi-plus-circle"></i> 创建工单</a>
            <a href="#" onclick="showPage('vendors')" id="nav-vendors"><i class="bi bi-people"></i> 运维商</a>
            <a href="#" onclick="showPage('stats')" id="nav-stats"><i class="bi bi-bar-chart"></i> 统计分析</a>
            <a href="#" onclick="showPage('chat')" id="nav-chat"><i class="bi bi-chat-dots"></i> AI 对话</a>
        </div>
        
        <div class="col-md-10 p-4">
            <div id="page-dashboard">
                <h4 class="mb-4"><i class="bi bi-speedometer2"></i> 数据看板</h4>
                <div class="row">
                    <div class="col-md-3"><div class="stat-card bg-white"><div class="text-muted">待分配</div><h3 class="text-warning" id="stat-待分配">0</h3></div></div>
                    <div class="col-md-3"><div class="stat-card bg-white"><div class="text-muted">处理中</div><h3 class="text-info" id="stat-处理中">0</h3></div></div>
                    <div class="col-md-3"><div class="stat-card bg-white"><div class="text-muted">本周新增</div><h3 class="text-primary" id="stat-本周新增">0</h3></div></div>
                    <div class="col-md-3"><div class="stat-card bg-white"><div class="text-muted">本月完成</div><h3 class="text-success" id="stat-本月完成">0</h3></div></div>
                </div>
                <div class="table-responsive mt-4">
                    <h5>最近工单</h5>
                    <table class="table table-hover" id="recent-table"><thead><tr><th>工单号</th><th>网点</th><th>设备类型</th><th>状态</th><th>时间</th></tr></thead><tbody></tbody></table>
                </div>
            </div>
            
            <div id="page-workorders" style="display:none;">
                <h4 class="mb-4"><i class="bi bi-file-earmark-text"></i> 工单管理</h4>
                <div class="d-flex gap-2 mb-3">
                    <button class="btn btn-outline-secondary" onclick="filterStatus('all')">全部</button>
                    <button class="btn btn-outline-warning" onclick="filterStatus('待分配')">待分配</button>
                    <button class="btn btn-outline-info" onclick="filterStatus('已分配')">已分配</button>
                    <button class="btn btn-outline-purple" onclick="filterStatus('处理中')">处理中</button>
                    <button class="btn btn-outline-success" onclick="filterStatus('已完成')">已完成</button>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover" id="workorder-table"><thead><tr><th>工单号</th><th>部门</th><th>设备</th><th>描述</th><th>状态</th><th>运维商</th><th>时间</th><th>操作</th></tr></thead><tbody></tbody></table>
                </div>
            </div>
            
            <div id="page-create" style="display:none;">
                <h4 class="mb-4"><i class="bi bi-plus-circle"></i> 创建工单</h4>
                <div class="card">
                    <div class="card-body">
                        <form id="workorder-form">
                            <div class="row">
                                <div class="col-md-6 mb-3"><label class="form-label">报修部门 *</label><input type="text" class="form-control" id="wo-dept" required></div>
                                <div class="col-md-6 mb-3"><label class="form-label">地址</label><input type="text" class="form-control" id="wo-address"></div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3"><label class="form-label">报修人 *</label><input type="text" class="form-control" id="wo-person" required></div>
                                <div class="col-md-6 mb-3"><label class="form-label">电话 *</label><input type="tel" class="form-control" id="wo-phone" required></div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3"><label class="form-label">设备类型 *</label>
                                    <select class="form-select" id="wo-type" required>
                                        <option value="">选择类型</option>
                                        <option value="ATM/取款机">ATM/取款机</option>
                                        <option value="存取款一体机">存取款一体机</option>
                                        <option value="LED显示屏">LED显示屏/灯箱</option>
                                        <option value="门头灯箱">门头灯箱</option>
                                        <option value="空调">空调</option>
                                        <option value="电器维修">电器维修</option>
                                        <option value="保险柜/枪柜">保险柜/枪柜</option>
                                        <option value="其他">其他</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3"><label class="form-label">故障描述 *</label><input type="text" class="form-control" id="wo-desc" required></div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3"><label class="form-label">运维商</label><select class="form-select" id="wo-vendor"><option value="">自动匹配</option></select></div>
                                <div class="col-md-6 mb-3"><label class="form-label">备注</label><input type="text" class="form-control" id="wo-remark"></div>
                            </div>
                            <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> 保存工单</button>
                        </form>
                    </div>
                </div>
            </div>
            
            <div id="page-vendors" style="display:none;">
                <h4 class="mb-4"><i class="bi bi-people"></i> 运维商信息</h4>
                <div class="table-responsive"><table class="table table-hover" id="vendor-table"><thead><tr><th>设备类型</th><th>品牌</th><th>运维商</th><th>联系人</th><th>电话</th><th>备注</th></tr></thead><tbody></tbody></table></div>
            </div>
            
            <div id="page-stats" style="display:none;">
                <h4 class="mb-4"><i class="bi bi-bar-chart"></i> 统计分析</h4>
                <div class="row mb-4">
                    <div class="col-md-12"><div class="card"><div class="card-body"><h5>本周数据摘要</h5><div id="week-summary"></div></div></div></div>
                </div>
                <div class="row">
                    <div class="col-md-6"><div class="card mb-4"><div class="card-body"><h5>设备类型分布</h5><canvas id="chart-type"></canvas></div></div></div>
                    <div class="col-md-6"><div class="card mb-4"><div class="card-body"><h5>工单状态</h5><canvas id="chart-status"></canvas></div></div></div>
                </div>
                <div class="row">
                    <div class="col-md-12"><div class="card"><div class="card-body"><h5>工单明细</h5><button class="btn btn-success btn-sm mb-2" onclick="exportExcel()">导出Excel</button><div class="table-responsive" style="max-height:400px;overflow-y:auto;"><table class="table table-sm" id="stats-table"><thead><tr><th>工单号</th><th>部门</th><th>设备</th><th>状态</th><th>运维商</th><th>创建时间</th><th>完成时间</th><th>时长(小时)</th></tr></thead><tbody></tbody></table></div></div></div></div>
                </div>
            </div>
            
            <div id="page-chat" style="display:none;">
                <h4 class="mb-4"><i class="bi bi-chat-dots"></i> AI 智能分析</h4>
                <div class="card">
                    <div class="card-body">
                        <p class="text-muted">粘贴工单信息，AI自动分析分类</p>
                        <div class="mb-3"><textarea class="form-control" id="ai-input" rows="6" placeholder="例如：报修部门：武鸣狮山路小微支行&#10;地址：南宁市武鸣区狮山路6号桂林银行&#10;报修人：石倩华19977134384&#10;故障：门头Led部分灯不亮"></textarea></div>
                        <button class="btn btn-primary" onclick="analyzeWorkorder()">AI 分析</button>
                    </div>
                </div>
                <div class="card mt-3" id="analysis-result" style="display:none;">
                    <div class="card-body">
                        <h5>分析结果</h5>
                        <div id="analysis-content"></div>
                        <button class="btn btn-success mt-3" onclick="createFromAnalysis()">创建工单</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
<script>
const vendors = [
    {type:'ATM/取款机', brand:'广电运通', vendor:'广西捷铭机电', contact:'德厚', phone:'18176258161'},
    {type:'ATM/取款机', brand:'恒银', vendor:'桂林天佑科技', contact:'泰华', phone:'19977160868'},
    {type:'存取款一体机', brand:'广电运通', vendor:'广西捷铭机电', contact:'德厚', phone:'18176258161'},
    {type:'LED显示屏', brand:'联想', vendor:'桂林银盛电子', contact:'黎进', phone:'13977300868'},
    {type:'门头灯箱', brand:'', vendor:'桂林银源光电', contact:'陈新光', phone:'19077160868'},
    {type:'空调', brand:'', vendor:'五星电器维修', contact:'莫先生', phone:'13457271088'},
    {type:'电器维修', brand:'', vendor:'桂林银科空调', contact:'莫生', phone:'18278398618'},
    {type:'保险柜/枪柜', brand:'', vendor:'桂林安盾技防', contact:'欧卫', phone:'18178368361'},
    {type:'其他', brand:'', vendor:'待分配', contact:'', phone:''},
];

let workorders = JSON.parse(localStorage.getItem('workorders') || '[]');
let currentFilter = 'all';
let analyzedData = null;

function saveWorkorders() {
    localStorage.setItem('workorders', JSON.stringify(workorders));
    renderDashboard(); renderWorkorders(); renderStats();
}

function getVendor(type) {
    const v = vendors.find(x => x.type === type);
    return v ? v.vendor : '待分配';
}

function getVendorContact(type) {
    const v = vendors.find(x => x.type === type);
    return v ? {contact:v.contact, phone:v.phone} : {contact:'', phone:''};
}

function generateOrderNo() {
    const now = new Date();
    return 'WO' + now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0') + String(workorders.length+1).padStart(4,'0');
}

function analyzeWorkorder() {
    const input = document.getElementById('ai-input').value;
    if(!input.trim()){alert('请输入工单信息');return;}
    
    let dept='', address='', person='', phone='', type='其他', desc='';
    const deptMatch = input.match(/报修部门[：:]\s*(.+)/);
    if(deptMatch) dept = deptMatch[1].trim();
    const addrMatch = input.match(/地址[：:]\s*(.+)/);
    if(addrMatch) address = addrMatch[1].trim();
    const personMatch = input.match(/报修人[：:]\s*(.+?)(?:,|，|联系电话|$)/);
    if(personMatch) person = personMatch[1].trim();
    const phoneMatch = input.match(/电话[：:]\s*(\d{11})/);
    if(phoneMatch) phone = phoneMatch[1].trim();
    else{const m=input.match(/(\d{11})/);if(m)phone=m[1];}
    const descMatch = input.match(/故障[：:]\s*(.+)/);
    if(descMatch) desc = descMatch[1].trim();
    
    const lower = input.toLowerCase();
    if(lower.includes('atm')||lower.includes('取款机'))type='ATM/取款机';
    else if(lower.includes('存款')||lower.includes('存取款'))type='存取款一体机';
    else if(lower.includes('led')||lower.includes('显示屏')||lower.includes('灯箱')||lower.includes('门头'))type='LED显示屏';
    else if(lower.includes('空调'))type='空调';
    else if(lower.includes('保险柜')||lower.includes('枪柜'))type='保险柜/枪柜';
    
    if(!address && dept) address = dept;
    const vendor = getVendor(type);
    const vc = getVendorContact(type);
    analyzedData = {dept, address, person, phone, type, desc, vendor, vc};
    
    document.getElementById('analysis-result').style.display = 'block';
    document.getElementById('analysis-content').innerHTML = '<table class="table table-bordered"><tr><td>部门</td><td>'+(dept||'-')+'</td></tr><tr><td>地址</td><td>'+(address||'-')+'</td></tr><tr><td>报修人</td><td>'+(person||'-')+'</td></tr><tr><td>电话</td><td>'+(phone||'-')+'</td></tr><tr><td>设备类型</td><td><span class="badge bg-info">'+type+'</span></td></tr><tr><td>故障</td><td>'+(desc||'-')+'</td></tr><tr><td>推荐运维商</td><td><strong>'+vendor+'</strong> '+(vc.phone||'')+'</td></tr></table>';
}

function createFromAnalysis(){
    if(!analyzedData)return;
    document.getElementById('wo-dept').value = analyzedData.dept||'';
    document.getElementById('wo-address').value = analyzedData.address||'';
    document.getElementById('wo-person').value = analyzedData.person||'';
    document.getElementById('wo-phone').value = analyzedData.phone||'';
    document.getElementById('wo-type').value = analyzedData.type||'';
    document.getElementById('wo-desc').value = analyzedData.desc||'';
    document.getElementById('wo-vendor').value = analyzedData.vendor||'';
    showPage('create');
}

document.getElementById('workorder-form').addEventListener('submit',function(e){
    e.preventDefault();
    const order = {
        id:generateOrderNo(),
        dept:document.getElementById('wo-dept').value,
        address:document.getElementById('wo-address').value,
        person:document.getElementById('wo-person').value,
        phone:document.getElementById('wo-phone').value,
        type:document.getElementById('wo-type').value,
        desc:document.getElementById('wo-desc').value,
        vendor:document.getElementById('wo-vendor').value||getVendor(document.getElementById('wo-type').value),
        status:'待分配',
        remark:document.getElementById('wo-remark').value,
        createTime:new Date().toISOString(),
        assignTime:null,completeTime:null
    };
    workorders.unshift(order);saveWorkorders();
    alert('工单创建成功：'+order.id);
    this.reset();showPage('workorders');
});

function renderDashboard(){
    const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    const weekAgo=new Date(today.getTime()-7*86400000);
    const monthStart=new Date(now.getFullYear(),now.getMonth(),1);
    const 待分配=workorders.filter(o=>o.status==='待分配').length;
    const 处理中=workorders.filter(o=>o.status==='已分配'||o.status==='处理中').length;
    const 本周新增=workorders.filter(o=>new Date(o.createTime)>=weekAgo).length;
    const 本月完成=workorders.filter(o=>o.status==='已完成'&&o.completeTime&&new Date(o.completeTime)>=monthStart).length;
    document.getElementById('stat-待分配').textContent=待分配;
    document.getElementById('stat-处理中').textContent=处理中;
    document.getElementById('stat-本周新增').textContent=本周新增;
    document.getElementById('stat-本月完成').textContent=本月完成;
    document.querySelector('#recent-table tbody').innerHTML=workorders.slice(0,5).map(o=>'<tr><td>'+o.id+'</td><td>'+o.dept+'</td><td>'+o.type+'</td><td><span class="badge badge-'+o.status+'">'+o.status+'</span></td><td>'+new Date(o.createTime).toLocaleDateString()+'</td></tr>').join('');
}

function renderWorkorders(filter='all'){
    currentFilter=filter;
    let f = filter==='all'?workorders:workorders.filter(o=>o.status===filter);
    document.querySelector('#workorder-table tbody').innerHTML=f.map(o=>'<tr><td>'+o.id+'</td><td>'+o.dept+'</td><td>'+o.type+'</td><td>'+o.desc+'</td><td><span class="badge badge-'+o.status+'">'+o.status+'</span></td><td>'+(o.vendor||'-')+'</td><td>'+new Date(o.createTime).toLocaleString()+'</td><td><button class="btn btn-sm btn-outline-warning" onclick="assignOrder(\''+o.id+'\')">分配</button> <button class="btn btn-sm btn-outline-success" onclick="completeOrder(\''+o.id+'\')">完成</button></td></tr>').join('');
}

function filterStatus(s){renderWorkorders(s);}

function assignOrder(id){
    const o=workorders.find(x=>x.id===id);
    if(!o)return;
    const v=prompt('运维商：',o.vendor||getVendor(o.type));
    if(v){o.vendor=v;o.status='已分配';o.assignTime=new Date().toISOString();saveWorkorders();alert('已分配：'+v);}
}

function completeOrder(id){
    const o=workorders.find(x=>x.id===id);
    if(!o)return;
    if(confirm('确认完成？')){o.status='已完成';o.completeTime=new Date().toISOString();saveWorkorders();alert('已完成！');}
}

function renderVendors(){
    document.querySelector('#vendor-table tbody').innerHTML=vendors.map(v=>'<tr><td>'+v.type+'</td><td>'+(v.brand||'-')+'</td><td>'+v.vendor+'</td><td>'+(v.contact||'-')+'</td><td>'+(v.phone||'-')+'</td><td>'+(v.note||'-')+'</td></tr>').join('');
    const sel=document.getElementById('wo-vendor');
    sel.innerHTML='<option value="">自动匹配</option>';
    vendors.forEach(v=>{sel.innerHTML+='<option value="'+v.vendor+'">'+v.vendor+' ('+v.type+')</option>'});
}

function renderStats(){
    const now=new Date();
    const weekAgo=new Date(now.getTime()-7*86400000);
    const weekOrders=workorders.filter(o=>new Date(o.createTime)>=weekAgo);
    const weekCompleted=weekOrders.filter(o=>o.status==='已完成').length;
    let avgHours=0;
    const completed=workorders.filter(o=>o.status==='已完成'&&o.completeTime);
    if(completed.length>0)avgHours=(completed.reduce((s,o)=>s+(new Date(o.completeTime)-new Date(o.createTime))/36e5,0)/completed.length).toFixed(1);
    
    document.getElementById('week-summary').innerHTML='<div class="row"><div class="col-md-3"><h3>'+weekOrders.length+'</h3><p>本周新增</p></div><div class="col-md-3"><h3 class="text-success">'+weekCompleted+'</h3><p>本周完成</p></div><div class="col-md-3"><h3>'+completed.length+'</h3><p>累计完成</p></div><div class="col-md-3"><h3>'+avgHours+'h</h3><p>平均处理时长</p></div></div>';
    
    const typeCount={};
    workorders.forEach(o=>{typeCount[o.type]=(typeCount[o.type]||0)+1});
    const statusCount={待分配:0,已分配:0,处理中:0,已完成:0};
    workorders.forEach(o=>{if(statusCount[o.status]!==undefined)statusCount[o.status]++});
    
    new Chart(document.getElementById('chart-type'),{type:'doughnut',data:{labels:Object.keys(typeCount),datasets:[{data:Object.values(typeCount),backgroundColor:['#ff6384','#36a2eb','#ffce56','#4bc0c0','#9966ff','#ff9f40']}]}});
    new Chart(document.getElementById('chart-status'),{type:'pie',data:{labels:Object.keys(statusCount),datasets:[{data:Object.values(statusCount),backgroundColor:['#ffeaa7','#74b9ff','#a29bfe','#55efc4']}]}});
    
    document.querySelector('#stats-table tbody').innerHTML=workorders.map(o=>'<tr><td>'+o.id+'</td><td>'+o.dept+'</td><td>'+o.type+'</td><td>'+o.status+'</td><td>'+(o.vendor||'-')+'</td><td>'+(o.createTime?new Date(o.createTime).toLocaleDateString():'-')+'</td><td>'+(o.completeTime?new Date(o.completeTime).toLocaleDateString():'-')+'</td><td>'+(o.completeTime?((new Date(o.completeTime)-new Date(o.createTime))/36e5).toFixed(1):'-')+'</td></tr>').join('');
}

function exportExcel(){
    const ws=XLSX.utils.json_to_sheet(workorders.map(o=({工单号:o.id,部门:o.dept,地址:o.address,报修人:o.person,电话:o.phone,设备类型:o.type,故障描述:o.desc,状态:o.status,运维商:o.vendor,创建时间:o.createTime,分配时间:o.assignTime,完成时间:o.completeTime,备注:o.remark})));
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'工单');XLSX.writeFile(wb,'工单统计.xlsx');
}

function showPage(page){
    document.querySelectorAll('[id^="page-"]').forEach(p=>p.style.display='none');
    document.getElementById('page-'+page).style.display='block';
    document.querySelectorAll('.sidebar a').forEach(a=>a.classList.remove('active'));
    document.getElementById('nav-'+page).classList.add('active');
    if(page==='dashboard')renderDashboard();
    if(page==='workorders')renderWorkorders();
    if(page==='vendors')renderVendors();
    if(page==='stats')renderStats();
}

renderDashboard();renderVendors();
</script>
</body>
</html>
